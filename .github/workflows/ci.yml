name: CI

on:
  push:
  pull_request:

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Jest with coverage; fails if the coverage thresholds in jest.config.mjs aren't met.
      - run: npm run test:cov
      # Live API at build time; if fakestoreapi blocks the runner, the build uses the bundled snapshot.
      - run: npm run build

  e2e:
    name: E2E (Playwright, fixture mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Browsers are cached per Playwright version: a version bump changes the key and re-downloads.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # Always runs: on a cache hit it skips the browser download but still installs the OS dependencies,
      # which live outside the cache.
      - run: npm run e2e:install

      # playwright.config.ts builds and starts the app (CATALOGUE_SOURCE=fixture, .next-e2e) and uses CI
      # settings: forbidOnly, 2 retries, 1 worker, GitHub annotations.
      - run: npm run e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
